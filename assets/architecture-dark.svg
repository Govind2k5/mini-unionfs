<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">

  <!-- ============ Row A: syscall pipeline ============ -->
  <g>
    <rect x="165" y="30" width="190" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="260" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#c9d1d9">user process</text>
    <text x="260" y="72" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#8b949e">ls · cat · echo · rm</text>

    <rect x="375" y="30" width="140" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="445" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#c9d1d9">Linux VFS</text>

    <rect x="535" y="30" width="190" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="630" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#c9d1d9">FUSE kernel</text>
    <text x="630" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#c9d1d9">module</text>

    <rect x="745" y="30" width="130" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="810" y="65" text-anchor="middle" font-size="13" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#c9d1d9">/dev/fuse</text>

    <line x1="355" y1="60" x2="363" y2="60" stroke="#8b949e" stroke-width="1.5"/>
    <polygon points="373,60 363,55.5 363,64.5" fill="#8b949e"/>
    <line x1="515" y1="60" x2="523" y2="60" stroke="#8b949e" stroke-width="1.5"/>
    <polygon points="533,60 523,55.5 523,64.5" fill="#8b949e"/>
    <line x1="725" y1="60" x2="733" y2="60" stroke="#8b949e" stroke-width="1.5"/>
    <polygon points="743,60 733,55.5 733,64.5" fill="#8b949e"/>
  </g>

  <!-- connector A4 -> daemon -->
  <polyline points="810,90 810,120 500,120 500,140" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="500,150 495.5,140 504.5,140" fill="#8b949e"/>

  <!-- ============ Row B: userspace daemon ============ -->
  <rect x="250" y="150" width="500" height="70" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="500" y="180" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#c9d1d9">mini_unionfs</text>
  <text x="500" y="200" text-anchor="middle" font-size="11" fill="#8b949e">userspace daemon · libfuse3 · fuse_operations dispatch table</text>

  <line x1="500" y1="220" x2="500" y2="260" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="500,270 495.5,260 504.5,260" fill="#8b949e"/>

  <!-- ============ Row C: resolve_path ============ -->
  <rect x="370" y="270" width="260" height="55" rx="8" fill="#2b2100" stroke="#d29922" stroke-width="1.5"/>
  <text x="500" y="293" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#e3b341">resolve_path()</text>
  <text x="500" y="310" text-anchor="middle" font-size="10.5" fill="#8b949e">whiteout &gt; upper &gt; lower precedence</text>

  <!-- fan-out arrows -->
  <line x1="430" y1="325" x2="184" y2="388" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="175,390 183.6,383.2 185.8,391.9" fill="#8b949e"/>

  <line x1="500" y1="325" x2="500" y2="380" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="500,390 495.5,380 504.5,380" fill="#8b949e"/>

  <line x1="570" y1="325" x2="816" y2="388" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="825,390 814.2,391.9 816.4,383.2" fill="#8b949e"/>

  <!-- ============ Row D: three checks ============ -->
  <rect x="40" y="390" width="270" height="80" rx="8" fill="#2d0d0d" stroke="#f85149" stroke-width="1.5"/>
  <text x="175" y="415" text-anchor="middle" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffa198">① upper/.wh.&lt;name&gt;</text>
  <text x="175" y="434" text-anchor="middle" font-size="11" fill="#ffa198">whiteout marker</text>
  <text x="175" y="451" text-anchor="middle" font-size="10.5" fill="#ffa198">exists → return ENOENT</text>

  <rect x="365" y="390" width="270" height="80" rx="8" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <text x="500" y="415" text-anchor="middle" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#56d364">② upper_dir/&lt;path&gt;</text>
  <text x="500" y="434" text-anchor="middle" font-size="11" fill="#56d364">read-write layer</text>
  <text x="500" y="451" text-anchor="middle" font-size="10.5" fill="#56d364">exists → serve from here</text>

  <rect x="690" y="390" width="270" height="80" rx="8" fill="#0c2233" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="825" y="415" text-anchor="middle" font-size="12.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#79c0ff">③ lower_dir/&lt;path&gt;</text>
  <text x="825" y="434" text-anchor="middle" font-size="11" fill="#79c0ff">read-only base layer</text>
  <text x="825" y="451" text-anchor="middle" font-size="10.5" fill="#79c0ff">exists → serve · else ENOENT</text>

  <!-- ============ mutation arrows ============ -->
  <!-- cow_copy(): lower -> upper, triggered on first write -->
  <polyline points="805,470 805,500 500,500 500,480" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 5"/>
  <polygon points="500,470 495.5,480 504.5,480" fill="#3fb950"/>
  <text x="652" y="492" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">cow_copy() on first write</text>

  <!-- unlink() on a lower-origin file writes the whiteout marker -->
  <polyline points="845,470 845,545 175,545 175,480" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6 5"/>
  <polygon points="175,470 170.5,480 179.5,480" fill="#f85149"/>
  <text x="510" y="537" text-anchor="middle" font-size="11" font-weight="600" fill="#f85149">unlink() on a lower-origin file → writes whiteout marker</text>
</svg>
